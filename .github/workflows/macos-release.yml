name: macOS release

# Builds and tests the macOS app for a pushed tag, then leaves the ZIP on a draft release and the
# updated appcast in a workflow artifact. Nothing is public until the draft is published and the
# appcast is pushed to the appcast branch.
#
#   mac-v0.6.0-rc.1  a release candidate: a draft prerelease, offered only to builds on the rc channel
#   v0.6.0           a release: the ZIP joins that version's release beside the Windows ZIP, and the
#                    appcast offers it to every build, candidates included
on:
  push:
    tags: ["mac-v*-rc.*", "v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the version from the tag
        run: |
          version=${GITHUB_REF_NAME#mac-}
          version=${version#v}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ $version == *-rc.* ]]; then
            echo "CHANNEL=--channel rc" >> "$GITHUB_ENV"
            echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
            echo "TITLE=Sailwind Chartroom $version for macOS" >> "$GITHUB_ENV"
          else
            echo "TITLE=Sailwind Chartroom $version" >> "$GITHUB_ENV"
          fi
      - name: Package
        run: bash macos/scripts/package.sh "$VERSION" "$RUNNER_TEMP/packages"
      - name: Check the signing key matches the app
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          ditto -x -k "$RUNNER_TEMP/packages/SailwindChartroom-macos-universal-$VERSION.zip" "$RUNNER_TEMP/app"
          public=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$RUNNER_TEMP/app/Sailwind Chartroom.app/Contents/Info.plist")
          echo "$SPARKLE_PRIVATE_KEY" | node macos/scripts/check-update-key.mjs "$public"
      - name: Launch, relaunch and recovery test
        run: node macos/scripts/smoke.mjs "$RUNNER_TEMP/app/Sailwind Chartroom.app" "$RUNNER_TEMP/smoke"
      - name: Add the version to the appcast
        run: |
          feed="$RUNNER_TEMP/feed"
          mkdir -p "$feed"
          # Earlier versions stay listed: start from the published appcast when there is one.
          if git fetch --quiet origin appcast 2>/dev/null; then git show FETCH_HEAD:appcast.xml > "$feed/appcast.xml"; fi
          cp "$RUNNER_TEMP/packages/SailwindChartroom-macos-universal-$VERSION.zip" "$feed/"
          # CHANNEL is empty for a release, which puts it on the channel every build follows.
          echo "$SPARKLE_PRIVATE_KEY" | macos/.build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            --link "https://github.com/$GITHUB_REPOSITORY/releases" $CHANNEL --maximum-deltas 0 "$feed"
          cat "$feed/appcast.xml"
      - name: Keep the appcast and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/feed/appcast.xml
            ${{ runner.temp }}/smoke/*.json
            ${{ runner.temp }}/smoke/*.png
      - name: Add the ZIP to the release
        run: |
          zip="$RUNNER_TEMP/packages/SailwindChartroom-macos-universal-$VERSION.zip"
          # A release may already hold this version's Windows ZIP; otherwise a draft is started for it.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --draft $PRERELEASE --verify-tag --title "$TITLE" --notes "Draft."
          fi
